[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-energy-prediction"
version = "0.0.1"
description = "A time-series energy prediction project."
requires-python = ">=3.11,<3.14"
dependencies = [
    "entsoe-py>=0.7",
    "fastparquet>=2023.0",
    "holidays>=0.40",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "joblib>=1.3",
    "jupyter-client>=8.10.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "meteostat>=1.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    "pyzmq>=27.2.0",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
    "seaborn>=0.12",
    "shap>=0.45",
    "streamlit>=1.30",
    "torch>=2.0",
    "watchdog>=6.0.0",
    "xgboost>=3.2.0",
]

[tool.ruff]
line-length = 150

[tool.uv]
package = false
